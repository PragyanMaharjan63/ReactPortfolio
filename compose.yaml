name: portfolio

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: maharjan-pragyan-portfolio:latest
    container_name: portfolio-app
    restart: unless-stopped
    ports:
      - "6767:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SITE_URL: ${SITE_URL:-https://maharjanpragyan.com.np}
      DATABASE_PATH: /app/data/portfolio.sqlite
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true

volumes:
  sqlite-data:
