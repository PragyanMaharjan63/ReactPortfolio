<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/penguin.png" />

    <title>Pragyan Maharjan — Front End Web Developer</title>
    <meta
      name="description"
      content="Portfolio of Pragyan Maharjan, a front end web developer from Lalitpur, Nepal, building web applications with React, JavaScript and Tailwind CSS."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111318" />

    <!--
      Fonts are loaded here rather than with @import inside the CSS. An
      @import sits at the top of the stylesheet, so the browser cannot even
      start fetching the fonts until the CSS has downloaded and parsed.
      A <link> starts both in parallel, and preconnect warms the TLS
      handshake to the font hosts first.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lexend+Deca:wght@300..800&family=Poppins:wght@300;400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
