# nginx configuration for the built Vite SPA.
# Tuned to run as an unprivileged user on port 8080: every path nginx needs
# to write to lives under /tmp, so no root-owned directories are required.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable scratch paths for the non-root runtime user.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    access_log /dev/stdout;

    # Cache policy is resolved here rather than per-location, because an
    # `add_header` inside a location block discards every header inherited
    # from the server block. Keeping all add_header directives at server
    # level is the only way the security headers survive on every response.
    map $uri $cache_control {
        # Vite emits content-hashed filenames under /assets/, so they are
        # safe to cache forever.
        ~^/assets/  "public, max-age=31536000, immutable";
        # Everything else — above all index.html — must revalidate, or a
        # deploy would not be picked up until the browser cache expires.
        default     "no-cache, must-revalidate";
    }

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;
    keepalive_timeout 30;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Declared once, at server level only — see the map above.
        add_header Cache-Control           $cache_control                    always;
        add_header X-Content-Type-Options  "nosniff"                         always;
        add_header X-Frame-Options         "SAMEORIGIN"                      always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # Health endpoint used by both HEALTHCHECK and the Jenkins pipeline.
        location = /healthz {
            access_log   off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Hashed build output: a miss here is a genuine 404, not an SPA route.
        location /assets/ {
            try_files $uri =404;
        }

        # Single-page app fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
